name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    name: Build & Publish Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify Java environment
        run: |
          set -euo pipefail
          echo "JAVA_HOME=${JAVA_HOME:-<unset>}"
          java -version

          VERSION_LINE=$(java -version 2>&1 | head -n 1 || true)
          RAW_VER=$(echo "$VERSION_LINE" | sed -n 's/.*"\([^"]*\)".*/\1/p')
          if [ -z "$RAW_VER" ]; then
            echo "::error::Unable to detect active Java version from: $VERSION_LINE"
            exit 1
          fi

          if [[ "$RAW_VER" == 1.* ]]; then
            MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f2)
          else
            MAJOR_VER=$(echo "$RAW_VER" | cut -d'.' -f1 | sed 's/[^0-9].*//')
          fi

          if ! [[ "$MAJOR_VER" =~ ^[0-9]+$ ]]; then
            echo "::error::Could not parse Java major version from '$RAW_VER'."
            exit 1
          fi

          echo "Detected Java major version: $MAJOR_VER"
          if [ "$MAJOR_VER" -lt 17 ]; then
            echo "::error::Java 17 or newer is required, but detected Java $MAJOR_VER."
            exit 1
          fi

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          set -euo pipefail
          KEYTOOL_BIN="${JAVA_HOME:+$JAVA_HOME/bin/keytool}"
          if [ -z "$KEYTOOL_BIN" ] || [ ! -x "$KEYTOOL_BIN" ]; then
            KEYTOOL_BIN=$(command -v keytool || true)
          fi
          if [ -z "$KEYTOOL_BIN" ] || [ ! -x "$KEYTOOL_BIN" ]; then
            echo "::error::keytool from Java 17 installation was not found."
            exit 1
          fi

          if [ ! -f "./debug.keystore" ]; then
            "$KEYTOOL_BIN" -genkeypair -v \
              -keystore "./debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 >/dev/null 2>&1
          fi

          if [ ! -f "./debug.keystore" ] || [ ! -s "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore."
            exit 1
          fi
          echo "Temporary debug keystore is ready."

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          set -euo pipefail
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -e "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            if [ -d "app/build/outputs/apk" ]; then
              echo "Discovered APK files inside app/build/outputs/apk:"
              find app/build/outputs/apk -type f -name '*.apk' -print || true
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -f "$EXPECTED_APK" ] || [ ! -s "$EXPECTED_APK" ] || [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK is not a valid, non-empty .apk regular file."
            exit 1
          fi

          echo "Verified debug APK: $EXPECTED_APK ($(wc -c < "$EXPECTED_APK") bytes)"

      - name: Upload debug APK artifact
        id: upload_artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          set -euo pipefail
          SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$SOURCE_APK" ] || [ ! -s "$SOURCE_APK" ]; then
            echo "::error::Verified APK missing at $SOURCE_APK"
            exit 1
          fi

          RAW_REPO_NAME="${GITHUB_REPOSITORY#*/}"
          SAFE_REPO_NAME=$(echo "$RAW_REPO_NAME" \
            | tr '[:upper:]' '[:lower:]' \
            | sed 's/[^a-zA-Z0-9._-]/-/g' \
            | sed 's/-\{2,\}/-/g; s/^-//; s/-$//')
          if [ -z "$SAFE_REPO_NAME" ]; then
            SAFE_REPO_NAME="android-app"
          fi

          ASSET_NAME="${SAFE_REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          ASSET_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/apk-release-XXXXXX")
          ASSET_PATH="${ASSET_DIR}/${ASSET_NAME}"

          cp "$SOURCE_APK" "$ASSET_PATH"

          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi

          {
            echo "asset_path=$ASSET_PATH"
            echo "asset_name=$ASSET_NAME"
          } >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $ASSET_NAME"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::GitHub CLI (gh) is not installed."
            exit 1
          fi
          gh --version

          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ -z "$ASSET_PATH" ] || [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::warning::Prepared release asset is missing or invalid: $ASSET_PATH"
            exit 1
          fi

          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"

          NOTES_FILE=$(mktemp "${RUNNER_TEMP:-/tmp}/release-notes-XXXXXX.md")
          printf '%s\n' \
            "- This is an automatically generated debug APK." \
            "- The APK was built by GitHub Actions." \
            "- GitHub Actions run number: ${GITHUB_RUN_NUMBER}" \
            "- GitHub Actions run attempt: ${GITHUB_RUN_ATTEMPT}" \
            "- Source commit SHA: ${GITHUB_SHA}" \
            "- The APK is intended for testing." \
            "- The APK is not a Play Store production release." \
            "- The APK is signed only with a temporary debug keystore." > "$NOTES_FILE"

          gh release create "$RELEASE_TAG" "$ASSET_PATH" \
            --title "$RELEASE_TITLE" \
            --notes-file "$NOTES_FILE" \
            --target "$GITHUB_SHA" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RELEASE_TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          RELEASE_TITLE="Debug APK Build #${GITHUB_RUN_NUMBER}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "${{ steps.upload_artifact.outcome }}" != "success" ]; then
            echo "::error::Debug APK build or artifact upload did not succeed."
            {
              echo "### Debug APK Build Failed"
              echo ""
              echo "The debug APK build or artifact upload step did not complete successfully."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL=$(gh release view "$RELEASE_TAG" --json url --jq '.url')
            CONFIRMED_TITLE=$(gh release view "$RELEASE_TAG" --json name --jq '.name')
            CONFIRMED_ASSET=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets[0].name // empty')

            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
            echo "Release URL: $RELEASE_URL"
            echo "APK Asset Filename: ${CONFIRMED_ASSET:-$ASSET_NAME}"

            {
              echo "### Debug APK Build & GitHub Release Published"
              echo ""
              echo "- **Release Tag:** \`$RELEASE_TAG\`"
              echo "- **Release Title:** ${CONFIRMED_TITLE:-$RELEASE_TITLE}"
              echo "- **APK Asset:** \`${CONFIRMED_ASSET:-$ASSET_NAME}\`"
              echo "- **GitHub Release Page:** $RELEASE_URL"
              echo ""
              echo "You can download the APK directly from the **Assets** section on the GitHub Release page above."
              echo ""
              echo "The GitHub Actions artifact \`app-debug-apk\` is also available as a backup in this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed, but the debug APK build succeeded and the Actions artifact 'app-debug-apk' remains available."
            {
              echo "### Debug APK Build Succeeded (Release Publishing Failed)"
              echo ""
              echo "> **Warning:** Publishing the GitHub Release failed, so no release URL was created."
              echo ""
              echo "- **Build Status:** Debug APK build succeeded"
              echo "- **Backup Download:** Download the \`app-debug-apk\` artifact from the **Artifacts** section of this GitHub Actions workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
